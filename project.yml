# XcodeGen spec for the iOS app. Regenerate with `xcodegen generate` and
# commit ScanToMe.xcodeproj together with this file. Target settings live here,
# not in Xcode.
name: ScanToMe
options:
  bundleIdPrefix: com.obarlier
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"
packages:
  ScanKit:
    path: Packages/ScanKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    # Olivier Barlier individual team (obarlier@gmail.com).
    DEVELOPMENT_TEAM: QUQFF7KH2L
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  ScanToMe:
    type: application
    platform: iOS
    sources:
      - path: ScanToMe
    dependencies:
      - package: ScanKit
        product: ScanKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.obarlier.scantome
        PRODUCT_NAME: ScanToMe
        INFOPLIST_FILE: ScanToMe/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.1.1"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
schemes:
  ScanToMe:
    build:
      targets:
        ScanToMe: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: ScanKit/ScanKitTests
